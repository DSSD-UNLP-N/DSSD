# Reglas por defecto de gitleaks, menos lo que es público a propósito (proyecto de facultad).
[extend]
useDefault = true

[allowlist]
description = "Claves de demo documentadas y ejemplos de la API"
paths = [
  '''backend/\.env\.(example|local|nube)''',
  '''nacional/\.env\.example''',
  '''entrega-3/swagger-api-nacional\.json''',
  '''docs/.*\.md''',
  '''README\.md''',
]
