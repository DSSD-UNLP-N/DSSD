name: Backend tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
        # test_bonita_integration.py se salta solo: necesita RUN_BONITA_INTEGRATION=1
        # y Bonita Studio corriendo, algo que no tiene sentido levantar en CI.
