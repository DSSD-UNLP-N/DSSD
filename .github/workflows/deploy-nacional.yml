name: Deploy API Nacional

on:
  pull_request:
    paths:
      - "nacional/**"
      - "render.yaml"
      - ".github/workflows/deploy-nacional.yml"
  push:
    branches: [main, dev]
    paths:
      - "nacional/**"
      - "render.yaml"
      - ".github/workflows/deploy-nacional.yml"

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t rescuesync-nacional ./nacional

  deploy:
    needs: image
    # El servicio de Render sigue la rama dev: un push a main no debe pisarlo con un commit más viejo.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar el deploy en Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dbakn0m1egvs73b3cb00
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY no está en los secrets: la imagen se construyó pero Render no se redespliega."
            exit 0
          fi
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d "{\"commitId\": \"$GITHUB_SHA\", \"clearCache\": \"do_not_clear\"}"
