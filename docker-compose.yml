services:
  db:
    image: postgres:16-alpine
    container_name: rescuesync-db
    environment:
      POSTGRES_USER: rescuesync
      POSTGRES_PASSWORD: rescuesync
      POSTGRES_DB: rescuesync
    ports:
      - "5432:5432"
    volumes:
      - rescuesync-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescuesync -d rescuesync"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rescuesync-pgdata:
